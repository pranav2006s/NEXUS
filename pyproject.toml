[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precedent-bouncer"
version = "0.3.1"
description = "Evidence-backed Git checks with a server-side Gemini API and trusted-team FastAPI adapter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
terminal = ["rich>=13"]
dev = ["pytest>=8", "httpx>=0.27,<1"]
cloud = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "cryptography>=43,<51"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
precedent = "precedent.cli:main"
precedent-server = "precedent.web.server:main"

[tool.setuptools.packages.find]
include = ["precedent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
