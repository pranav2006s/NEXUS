[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precedent-bouncer"
version = "0.2.0"
description = "Evidence-backed local Git history checks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
terminal = ["rich>=13"]
dev = ["pytest>=8", "httpx>=0.27,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
precedent = "precedent.cli:main"
precedent-server = "precedent.web.server:main"

[tool.setuptools.packages.find]
include = ["precedent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
